<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Sweet Journal & Love Space</title>
    <style>
        :root {
            --bg-color: #fcf6f5;
            --card-bg: #ffffff;
            --primary-color: #e27d60;
            --secondary-color: #85dcba;
            --text-color: #555555;
            --heading-color: #333333;
            --border-color: #f0dede;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            min-height: 100vh;
            box-shadow: 0 0 20px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
        }
        header {
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            background: #fff;
            position: sticky;
            top: 0;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        h1 {
            color: var(--primary-color);
            margin: 0 0 5px 0;
            font-size: 1.3rem;
            text-align: left;
        }
        .subtitle {
            font-size: 0.8rem;
            color: #888;
            text-align: left;
        }
        .content-area {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }
        /* 密码锁定屏样式 */
        #lock-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .lock-box {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            text-align: center;
            width: 80%;
            max-width: 320px;
        }
        .lock-box input {
            width: 80%;
            padding: 10px;
            margin: 15px 0;
            border: 1px solid #ddd;
            border-radius: 6px;
            text-align: center;
            font-size: 1rem;
        }
        .lock-box button {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
        }
        /* 卡片样式 */
        .card {
            background: #fff;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: #aaa;
            margin-bottom: 8px;
        }
        input[type="date"], textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            box-sizing: border-box;
            font-family: inherit;
            margin-bottom: 10px;
        }
        textarea {
            height: 80px;
            resize: none;
        }
        button.primary-btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            width: 100%;
        }
        .sync-status {
            font-size: 0.75rem;
            text-align: right;
            color: #888;
            margin-bottom: 10px;
        }
        .lang-btn {
            background: #fdf2f0;
            border: 1px solid #f5c6cb;
            color: var(--primary-color);
            padding: 5px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- 密码验证遮罩层 -->
    <div id="lock-screen" style="display: none;">
        <div class="lock-box">
            <h3 data-i18n="lock_title">🔒 Our Secret Space</h3>
            <p style="font-size: 0.85rem; color: #666;" data-i18n="lock_subtitle">Please enter passcode</p>
            <input type="password" id="pass-input" placeholder="Passcode">
            <br>
            <button onclick="checkPass()" data-i18n="lock_btn">Enter</button>
        </div>
    </div>

    <div class="container">
        <header>
            <div>
                <h1 data-i18n="main_title">Our Sweet Journal</h1>
                <div class="subtitle" id="days-counter">Recording our days</div>
            </div>
            <button class="lang-btn" onclick="toggleLanguage()" id="lang-btn-text">中文</button>
        </header>

        <div class="content-area">
            <div class="sync-status" id="sync-status">Status: Ready</div>
            
            <!-- 发布新内容区域 -->
            <div class="card">
                <input type="date" id="new-post-date">
                <textarea id="new-post-content" data-i18n-ph="post_ph" placeholder="What sweet thing happened today? Write it down..."></textarea>
                <button class="primary-btn" onclick="addNewPost()" data-i18n="post_btn">Publish to Cloud</button>
            </div>

            <!-- 内容列表展示区 -->
            <div id="posts-container">
                <!-- 动态加载内容 -->
            </div>
        </div>
    </div>

   <script>
        // ================= 配置区域 =================
        const SECRET_PASS = "42924"; // 你们的专属密码
        const LOVE_START_DATE = "2026-04-06"; // 在一起的纪念日

        // JsonBin.io 配置（换成你自己的 Key 和 Bin ID 即可实现双端同步）
        const JSONBIN_MASTER_KEY = "$2a$10$Hb.fuU6lxi7Nz83SOJDQou41uaW.bJ8ivHQXTn8aKB5KPd0QGXt12"; 
        const JSONBIN_BIN_ID = "6abdb802ac6210605a077b5f";
        // ============================================

        const i18n = {
            zh: {
                lock_title: "🔒 我们的专属空间",
                lock_subtitle: "请输入访问密码",
                lock_btn: "进入",
                main_title: "Our Sweet Journal",
                post_ph: "今天发生了什么甜蜜的事，写下来吧...",
                post_btn: "发布到云端同步",
                sync_ready: "状态: 准备就绪",
                sync_loading: "正在从云端同步...",
                sync_success: "状态: 已与云端同步最新数据 ✨",
                sync_error: "状态: 云端同步失败，使用本地缓存",
                sync_uploading: "正在同步到云端...",
                sync_done: "状态: 同步成功！双方可见 ☁️",
                empty_text: "还没有记录，快写下第一条吧~",
                days_prefix: "我们已经在一起第 ",
                days_suffix: " 天啦 ❤️",
                lang_switch: "EN"
            },
            en: {
                lock_title: "🔒 Our Secret Space",
                lock_subtitle: "Please enter passcode",
                lock_btn: "Enter",
                main_title: "Our Sweet Journal",
                post_ph: "What sweet thing happened today? Write it down...",
                post_btn: "Publish to Cloud",
                sync_ready: "Status: Ready",
                sync_loading: "Syncing from cloud...",
                sync_success: "Status: Synced with cloud ✨",
                sync_error: "Status: Cloud sync failed, using local cache",
                sync_uploading: "Uploading to cloud...",
                sync_done: "Status: Synced successfully! Visible to both ☁️",
                empty_text: "No records yet, write the first one~",
                days_prefix: "We have been together for ",
                days_suffix: " days ❤️",
                lang_switch: "中文"
            }
        };

        let currentLang = localStorage.getItem('love_lang') || 'en';

        function toggleLanguage() {
            currentLang = currentLang === 'zh' ? 'en' : 'zh';
            localStorage.setItem('love_lang', currentLang);
            updateTexts();
            calcDays();
        }

        function updateTexts() {
            const dict = i18n[currentLang];
            document.getElementById('lang-btn-text').innerText = dict.lang_switch;
            
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (dict[key]) el.innerText = dict[key];
            });

            document.querySelectorAll('[data-i18n-ph]').forEach(el => {
                const key = el.getAttribute('data-i18n-ph');
                if (dict[key]) el.placeholder = dict[key];
            });
        }

        function checkPass() {
            const input = document.getElementById('pass-input').value;
            if (input === SECRET_PASS) {
                document.getElementById('lock-screen').style.display = 'none';
                localStorage.setItem('auth_passed', 'true');
                initApp();
            } else {
                alert(currentLang === 'zh' ? '密码不对哦，再想想~' : 'Incorrect passcode, try again~');
            }
        }

        // 页面加载检查（实现免密登录：如果之前验证过，直接进，不弹密码框）
        window.onload = function() {
            updateTexts();
            
            // 默认给日期输入框填入今天
            document.getElementById('new-post-date').valueAsDate = new Date();

            if (localStorage.getItem('auth_passed') === 'true') {
                document.getElementById('lock-screen').style.display = 'none';
                initApp();
            } else {
                // 如果没验证过才显示密码框
                document.getElementById('lock-screen').style.display = 'flex';
            }
            calcDays();
        }

        // 计算在一起的天数（基于 2026-04-06）
        function calcDays() {
            const start = new Date(LOVE_START_DATE);
            const today = new Date();
            // 清除时间时分秒干扰，只算天数差
            start.setHours(0,0,0,0);
            today.setHours(0,0,0,0);
            const diff = Math.floor((today - start) / (1000 * 60 * 60 * 24));
            const dict = i18n[currentLang];
            document.getElementById('days-counter').innerText = `${dict.days_prefix}${Math.max(0, diff)}${dict.days_suffix}`;
        }

        let posts = [];

        async function initApp() {
            await fetchFromCloud();
            renderPosts();
        }

        async function fetchFromCloud() {
            const dict = i18n[currentLang];
            if (JSONBIN_MASTER_KEY.includes("YOUR_MASTER")) {
                document.getElementById('sync-status').innerText = currentLang === 'zh' ? "提示: 尚未配置云端，当前为本地模式" : "Tip: Local mode";
                posts = JSON.parse(localStorage.getItem('local_posts') || '[]');
                return;
            }

            try {
                document.getElementById('sync-status').innerText = dict.sync_loading;
                const response = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': JSONBIN_MASTER_KEY }
                });
                const data = await response.json();
                posts = data.record.posts || [];
                document.getElementById('sync-status').innerText = dict.sync_success;
            } catch (error) {
                console.error("同步失败", error);
                document.getElementById('sync-status').innerText = dict.sync_error;
                posts = JSON.parse(localStorage.getItem('local_posts') || '[]');
            }
        }

        async function saveToCloud() {
            const dict = i18n[currentLang];
            localStorage.setItem('local_posts', JSON.stringify(posts)); 

            if (JSONBIN_MASTER_KEY.includes("YOUR_MASTER")) return;

            try {
                document.getElementById('sync-status').innerText = dict.sync_uploading;
                await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': JSONBIN_MASTER_KEY
                    },
                    body: JSON.stringify({ posts: posts })
                });
                document.getElementById('sync-status').innerText = dict.sync_done;
            } catch (error) {
                console.error("保存云端失败", error);
            }
        }

        async function addNewPost() {
            const postDate = document.getElementById('new-post-date').value;
            const textContent = document.getElementById('new-post-content').value.trim();
            
            if (!textContent) {
                alert(currentLang === 'zh' ? '内容不能为空哦！' : 'Content cannot be empty!');
                return;
            }

            const newPost = {
                id: Date.now(),
                time: postDate || new Date().toISOString().split('T')[0],
                content: textContent
            };

            posts.unshift(newPost);
            document.getElementById('new-post-content').value = '';
            
            renderPosts();
            await saveToCloud();
        }

        function renderPosts() {
            const container = document.getElementById('posts-container');
            container.innerHTML = '';
            const dict = i18n[currentLang];
            
            if (posts.length === 0) {
                container.innerHTML = `<p style="text-align:center; color:#aaa; font-size:0.9rem;">${dict.empty_text}</p>`;
                return;
            }

            posts.forEach(post => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-header">
                        <span style="font-weight: bold; color: var(--primary-color);">${post.time}</span>
                    </div>
                    <div style="white-space: pre-wrap; font-size: 0.95rem; line-height: 1.4;">${post.content}</div>
                `;
                container.appendChild(card);
            });
        }
    </script>
</body>
</html>
