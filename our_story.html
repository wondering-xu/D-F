<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Sweet Journal & Love Space</title>
    <style>
        :root {
            --bg-color: #fcf6f5;
            --card-bg: #ffffff;
            --primary-color: #e27d60;
            --secondary-color: #85dcba;
            --text-color: #555555;
            --heading-color: #333333;
            --border-color: #f0dede;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            min-height: 100vh;
            box-shadow: 0 0 20px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            padding-bottom: 70px;
            box-sizing: border-box;
        }
        header {
            padding: 15px 20px;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            background: #fff;
            position: sticky;
            top: 0;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        h1 {
            color: var(--primary-color);
            margin: 0 0 3px 0;
            font-size: 1.2rem;
            text-align: left;
        }
        .subtitle {
            font-size: 0.75rem;
            color: #888;
            text-align: left;
        }
        .header-right {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .content-area {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }
        /* 底部导航栏 */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 600px;
            background: #fff;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 100;
        }
        .nav-item {
            background: none;
            border: none;
            color: #888;
            font-size: 0.75rem;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
        }
        .nav-item.active {
            color: var(--primary-color);
            font-weight: bold;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        /* 密码锁定屏样式 */
        #lock-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .lock-box {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            text-align: center;
            width: 80%;
            max-width: 320px;
        }
        .lock-box input {
            width: 80%;
            padding: 10px;
            margin: 15px 0;
            border: 1px solid #ddd;
            border-radius: 6px;
            text-align: center;
            font-size: 1rem;
        }
        .lock-box button {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
        }
        /* 卡片样式 */
        .card {
            background: #fff;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            color: #aaa;
            margin-bottom: 8px;
        }
        /* 身份标徽样式 */
        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
            color: white;
        }
        .badge-d { background-color: #3b82f6; } /* D：蓝色 */
        .badge-f { background-color: #f97316; } /* F：橘色 */

        textarea, input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            box-sizing: border-box;
            font-family: inherit;
            margin-bottom: 10px;
        }
        textarea {
            height: 80px;
            resize: none;
        }
        button.primary-btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            width: 100%;
        }
        .sync-status {
            font-size: 0.75rem;
            text-align: right;
            color: #888;
            margin-bottom: 10px;
        }
        .action-btn {
            background: #fdf2f0;
            border: 1px solid #f5c6cb;
            color: var(--primary-color);
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: bold;
        }
        /* 强力修复：确保身份切换按钮绝对可见且醒目 */
        .who-switch {
            display: inline-block !important;
            visibility: visible !important;
            opacity: 1 !important;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: bold;
            border: 1px solid #cbd5e1;
            background: #f8fafc;
            color: #334155;
        }
        /* 心愿单样式 */
        .bucket-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px dashed var(--border-color);
            transition: all 0.2s ease;
        }
        .bucket-item.completed span {
            text-decoration: line-through;
            color: #ccc !important;
        }
        .bucket-item.completed {
            opacity: 0.5;
        }
    </style>
</head>
<body>

    <!-- 密码验证遮罩层 -->
    <div id="lock-screen">
        <div class="lock-box">
            <h3 data-i18n="lock_title">🔒 Our Secret Space</h3>
            <p style="font-size: 0.85rem; color: #666;" data-i18n="lock_subtitle">Please enter passcode</p>
            <input type="password" id="pass-input" placeholder="Passcode">
            <br>
            <button onclick="checkPass()" data-i18n="lock_btn">Enter</button>
        </div>
    </div>

    <div class="container">
        <header>
            <div>
                <h1 data-i18n="main_title">Our Sweet Journal</h1>
                <div class="subtitle" id="days-counter">Recording our days</div>
            </div>
            <div class="header-right">
                <!-- 身份切换按钮：点击可在 D 和 F 之间切换 -->
                <button class="who-switch" id="who-btn" onclick="toggleWho()">Who: F</button>
                <button class="action-btn" onclick="toggleLanguage()" id="lang-btn-text">中文</button>
            </div>
        </header>

        <div class="content-area">
            <div class="sync-status" id="sync-status">Status: Ready</div>
            
            <!-- 版块 1：日常时间轴 (Journal) -->
            <div id="tab-journal" class="tab-content active">
                <div class="card">
                    <textarea id="new-post-content" data-i18n-ph="post_ph" placeholder="What sweet thing happened today? Write it down..."></textarea>
                    <button class="primary-btn" onclick="addNewPost()" data-i18n="post_btn">Publish to Cloud</button>
                </div>
                <div id="posts-container"></div>
            </div>

            <!-- 版块 2：心愿清单 (Bucket List) -->
            <div id="tab-bucket" class="tab-content">
                <div class="card">
                    <h3 style="margin-top:0; font-size:1rem; color:var(--primary-color);" data-i18n="bucket_title">✨ Our Bucket List</h3>
                    <input type="text" id="new-bucket-input" data-i18n-ph="bucket_ph" placeholder="Add a new dream to do together...">
                    <button class="primary-btn" onclick="addBucketItem()" data-i18n="bucket_btn">Add Wish</button>
                </div>
                <div class="card" id="bucket-container"></div>
            </div>

            <!-- 版块 3：做过的事情 (Memories / Done List) -->
            <div id="tab-memories" class="tab-content">
                <div class="card">
                    <h3 style="margin-top:0; font-size:1rem; color:var(--primary-color);" data-i18n="memories_title">🌟 Things We've Done</h3>
                    <textarea id="new-memory-content" data-i18n-ph="memories_ph" placeholder="Record a wonderful thing we have accomplished together..."></textarea>
                    <button class="primary-btn" onclick="addMemoryItem()" data-i18n="memories_btn">Add Memory</button>
                </div>
                <div id="memories-container"></div>
            </div>

            <!-- 版块 4：纪念小纸条 (Notes) -->
            <div id="tab-notes" class="tab-content">
                <div class="card">
                    <h3 style="margin-top:0; font-size:1rem; color:var(--primary-color);" data-i18n="notes_title">💌 Sweet Notes</h3>
                    <textarea id="new-note-content" data-i18n-ph="notes_ph" placeholder="Leave a romantic note for each other..."></textarea>
                    <button class="primary-btn" onclick="addNoteItem()" data-i18n="notes_btn">Leave Note</button>
                </div>
                <div id="notes-container"></div>
            </div>
        </div>

        <!-- 底部导航切换栏 -->
        <nav class="bottom-nav">
            <button class="nav-item active" onclick="switchTab('journal', this)">
                <span>📖</span>
                <span data-i18n="nav_journal">Journal</span>
            </button>
            <button class="nav-item" onclick="switchTab('bucket', this)">
                <span>🎯</span>
                <span data-i18n="nav_bucket">Bucket</span>
            </button>
            <button class="nav-item" onclick="switchTab('memories', this)">
                <span>🌟</span>
                <span data-i18n="nav_memories">Memories</span>
            </button>
            <button class="nav-item" onclick="switchTab('notes', this)">
                <span>💌</span>
                <span data-i18n="nav_notes">Notes</span>
            </button>
        </nav>
    </div>

     <script>
        // ================= 配置区域 =================
        const SECRET_PASS = "42924"; // 专属密码
        const LOVE_START_DATE = "2026-04-06"; // 你们在一起的纪念日

        // JsonBin.io 配置（双端同步）
        const JSONBIN_MASTER_KEY = "$2a$10$Hb.fuU6lxi7Nz83SOJDQou41uaW.bJ8ivHQXTn8aKB5KPd0QGXt12"; 
        const JSONBIN_BIN_ID = "6abdb802ac6210605a077b5f";
        // ============================================

        // 当前选中的发件人身份 (F 或 D)
        let currentWho = localStorage.getItem('love_current_who') || 'F';

        // 双语字典
        const i18n = {
            zh: {
                lock_title: "🔒 我们的专属空间",
                lock_subtitle: "请输入访问密码",
                lock_btn: "进入",
                main_title: "Our Sweet Journal",
                post_ph: "今天发生了什么甜蜜的事，写下来吧...",
                post_btn: "发布到云端同步",
                bucket_title: "✨ 我们的愿望清单",
                bucket_ph: "添加一个以后想一起完成的愿望...",
                bucket_btn: "添加愿望",
                memories_title: "🌟 我们做过的事情",
                memories_ph: "记录一件我们一起完成的精彩回忆...",
                memories_btn: "添加回忆",
                notes_title: "💌 浪漫小纸条",
                notes_ph: "给对方留下一句话吧...",
                notes_btn: "发送纸条",
                nav_journal: "日记",
                nav_bucket: "心愿",
                nav_memories: "足迹",
                nav_notes: "纸条",
                sync_ready: "状态: 准备就绪",
                sync_loading: "正在从云端同步...",
                sync_success: "状态: 已与云端同步最新数据 ✨",
                sync_error: "状态: 云端同步失败，使用本地缓存",
                sync_uploading: "正在同步到云端...",
                sync_done: "状态: 同步成功！双方可见 ☁️",
                empty_text: "还没有记录，快写下第一条吧~",
                days_prefix: "我们已经在一起第 ",
                days_suffix: " 天啦 ❤️",
                lang_switch: "EN"
            },
            en: {
                lock_title: "🔒 Our Secret Space",
                lock_subtitle: "Please enter passcode",
                lock_btn: "Enter",
                main_title: "Our Sweet Journal",
                post_ph: "What sweet thing happened today? Write it down...",
                post_btn: "Publish to Cloud",
                bucket_title: "✨ Our Bucket List",
                bucket_ph: "Add a new dream to do together...",
                bucket_btn: "Add Wish",
                memories_title: "🌟 Things We've Done",
                memories_ph: "Record a wonderful thing we have accomplished together...",
                memories_btn: "Add Memory",
                notes_title: "💌 Sweet Notes",
                notes_ph: "Leave a romantic note for each other...",
                notes_btn: "Leave Note",
                nav_journal: "Journal",
                nav_bucket: "Bucket",
                nav_memories: "Memories",
                nav_notes: "Notes",
                sync_ready: "Status: Ready",
                sync_loading: "Syncing from cloud...",
                sync_success: "Status: Synced with cloud ✨",
                sync_error: "Status: Cloud sync failed, using local cache",
                sync_uploading: "Uploading to cloud...",
                sync_done: "Status: Synced successfully! Visible to both ☁️",
                empty_text: "No records yet, write the first one~",
                days_prefix: "We have been together for ",
                days_suffix: " days ❤️",
                lang_switch: "中文"
            }
        };

        let currentLang = localStorage.getItem('love_lang') || 'en';
        let appData = {
            posts: [],
            bucket: [],
            memories: [],
            notes: []
        };

        function toggleLanguage() {
            currentLang = currentLang === 'zh' ? 'en' : 'zh';
            localStorage.setItem('love_lang', currentLang);
            updateTexts();
            calcDays();
            renderAll();
        }

        function toggleWho() {
            currentWho = currentWho === 'F' ? 'D' : 'F';
            localStorage.setItem('love_current_who', currentWho);
            updateWhoButton();
        }

        function updateWhoButton() {
            const btn = document.getElementById('who-btn');
            if (!btn) return;
            btn.innerText = `Who: ${currentWho}`;
            if (currentWho === 'D') {
                btn.style.background = '#e0f2fe';
                btn.style.color = '#0369a1';
                btn.style.borderColor = '#bae6fd';
            } else {
                btn.style.background = '#fff7ed';
                btn.style.color = '#c2410c';
                btn.style.borderColor = '#ffedd5';
            }
        }

        function updateTexts() {
            const dict = i18n[currentLang];
            document.getElementById('lang-btn-text').innerText = dict.lang_switch;
            
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (dict[key]) el.innerText = dict[key];
            });

            document.querySelectorAll('[data-i18n-ph]').forEach(el => {
                const key = el.getAttribute('data-i18n-ph');
                if (dict[key]) el.placeholder = dict[key];
            });
        }

        // 切换导航版块
        function switchTab(tabName, btnElement) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.bottom-nav .nav-item').forEach(el => el.classList.remove('active'));
            
            document.getElementById('tab-' + tabName).classList.add('active');
            btnElement.classList.add('active');
        }

        // 检查密码
        function checkPass() {
            const input = document.getElementById('pass-input').value;
            if (input === SECRET_PASS) {
                document.getElementById('lock-screen').style.display = 'none';
                localStorage.setItem('auth_passed', 'true');
                initApp();
            } else {
                alert(currentLang === 'zh' ? '密码不对哦，再想想~' : 'Incorrect passcode, try again~');
            }
        }

        window.onload = function() {
            updateTexts();
            updateWhoButton();
            if (localStorage.getItem('auth_passed') === 'true') {
                document.getElementById('lock-screen').style.display = 'none';
                initApp();
            }
            calcDays();
        }

        // 计算在一起的天数
        function calcDays() {
            const start = new Date(LOVE_START_DATE);
            const today = new Date();
            const diff = Math.floor((today - start) / (1000 * 60 * 60 * 24));
            const dict = i18n[currentLang];
            document.getElementById('days-counter').innerText = `${dict.days_prefix}${Math.max(0, diff)}${dict.days_suffix}`;
        }

        // 初始化应用
        async function initApp() {
            await fetchFromCloud();
            renderAll();
        }

        // 从云端加载数据
        async function fetchFromCloud() {
            const dict = i18n[currentLang];
            if (JSONBIN_MASTER_KEY.includes("YOUR_MASTER")) {
                document.getElementById('sync-status').innerText = currentLang === 'zh' ? "提示: 尚未配置云端密钥，当前为本地模式" : "Tip: Cloud key not set, local mode";
                loadLocal();
                return;
            }

            try {
                document.getElementById('sync-status').innerText = dict.sync_loading;
                const response = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': JSONBIN_MASTER_KEY }
                });
                const data = await response.json();
                appData = data.record || { posts: [], bucket: [], memories: [], notes: [] };
                if (!appData.memories) appData.memories = [];
                document.getElementById('sync-status').innerText = dict.sync_success;
            } catch (error) {
                console.error("同步失败", error);
                document.getElementById('sync-status').innerText = dict.sync_error;
                loadLocal();
            }
        }

        function loadLocal() {
            const local = localStorage.getItem('love_app_data');
            if (local) {
                appData = JSON.parse(local);
                if (!appData.memories) appData.memories = [];
            }
        }

        // 保存数据到云端
        async function saveToCloud() {
            const dict = i18n[currentLang];
            localStorage.setItem('love_app_data', JSON.stringify(appData)); 

            if (JSONBIN_MASTER_KEY.includes("YOUR_MASTER")) return;

            try {
                document.getElementById('sync-status').innerText = dict.sync_uploading;
                await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': JSONBIN_MASTER_KEY
                    },
                    body: JSON.stringify(appData)
                });
                document.getElementById('sync-status').innerText = dict.sync_done;
            } catch (error) {
                console.error("保存云端失败", error);
            }
        }

        function renderAll() {
            renderPosts();
            renderBucket();
            renderMemories();
            renderNotes();
        }

        // 生成身份标签 HTML
        function getBadgeHtml(who) {
            const w = who || 'F';
            const cls = w === 'D' ? 'badge-d' : 'badge-f';
            return `<span class="badge ${cls}">${w}</span>`;
        }

        // 1. 发布日记
        async function addNewPost() {
            const textContent = document.getElementById('new-post-content').value.trim();
            if (!textContent) return;

            appData.posts.unshift({
                id: Date.now(),
                who: currentWho,
                time: new Date().toLocaleString(),
                content: textContent
            });
            document.getElementById('new-post-content').value = '';
            
            renderPosts();
            await saveToCloud();
        }

        function renderPosts() {
            const container = document.getElementById('posts-container');
            container.innerHTML = '';
            const dict = i18n[currentLang];
            
            if (!appData.posts || appData.posts.length === 0) {
                container.innerHTML = `<p style="text-align:center; color:#aaa; font-size:0.9rem;">${dict.empty_text}</p>`;
                return;
            }

            appData.posts.forEach(post => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-header">
                        <span>${post.time}</span>
                        ${getBadgeHtml(post.who)}
                    </div>
                    <div style="white-space: pre-wrap; font-size: 0.95rem; line-height: 1.4;">${post.content}</div>
                `;
                container.appendChild(card);
            });
        }

        // 2. 心愿单
        async function addBucketItem() {
            const text = document.getElementById('new-bucket-input').value.trim();
            if (!text) return;

            if (!appData.bucket) appData.bucket = [];
            appData.bucket.unshift({ id: Date.now(), who: currentWho, text: text, completed: false });
            document.getElementById('new-bucket-input').value = '';

            renderBucket();
            await saveToCloud();
        }

        async function toggleBucket(id) {
            const item = appData.bucket.find(b => b.id === id);
            if (item) {
                item.completed = !item.completed;
                renderBucket();
                await saveToCloud();
            }
        }

        function renderBucket() {
            const container = document.getElementById('bucket-container');
            container.innerHTML = '';
            const dict = i18n[currentLang];

            if (!appData.bucket || appData.bucket.length === 0) {
                container.innerHTML = `<p style="text-align:center; color:#aaa; font-size:0.9rem;">${dict.empty_text}</p>`;
                return;
            }

            appData.bucket.forEach(item => {
                const div = document.createElement('div');
                div.className = `bucket-item ${item.completed ? 'completed' : ''}`;
                div.innerHTML = `
                    <div style="display:flex; align-items:center; gap:8px; flex:1; cursor:pointer;" onclick="toggleBucket(${item.id})">
                        <span>${item.completed ? '✅' : '⏳'}</span>
                        <span style="font-size:0.95rem;">${item.text}</span>
                    </div>
                    <div style="display:flex; align-items:center; gap:8px;">
                        ${getBadgeHtml(item.who)}
                        <button style="border:none; background:none; color:#ccc; cursor:pointer;" onclick="deleteBucket(${item.id})">×</button>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        async function deleteBucket(id) {
            appData.bucket = appData.bucket.filter(b => b.id !== id);
            renderBucket();
            await saveToCloud();
        }

        // 3. 做过的事情 (Memories)
        async function addMemoryItem() {
            const text = document.getElementById('new-memory-content').value.trim();
            if (!text) return;

            if (!appData.memories) appData.memories = [];
            appData.memories.unshift({
                id: Date.now(),
                who: currentWho,
                time: new Date().toLocaleDateString(),
                content: text
            });
            document.getElementById('new-memory-content').value = '';

            renderMemories();
            await saveToCloud();
        }

        function renderMemories() {
            const container = document.getElementById('memories-container');
            container.innerHTML = '';
            const dict = i18n[currentLang];

            if (!appData.memories || appData.memories.length === 0) {
                container.innerHTML = `<p style="text-align:center; color:#aaa; font-size:0.9rem;">${dict.empty_text}</p>`;
                return;
            }

            appData.memories.forEach(memory => {
                const card = document.createElement('div');
                card.className = 'card';
                card.style.background = '#f4fbf7';
                card.style.borderColor = '#d8f3e5';
                card.innerHTML = `
                    <div class="card-header">
                        <span>${memory.time}</span>
                        ${getBadgeHtml(memory.who)}
                    </div>
                    <div style="white-space: pre-wrap; font-size: 0.95rem; line-height: 1.4; color: #2d6a4f;">🌟 ${memory.content}</div>
                `;
                container.appendChild(card);
            });
        }

        // 4. 小纸条
        async function addNoteItem() {
            const text = document.getElementById('new-note-content').value.trim();
            if (!text) return;

            if (!appData.notes) appData.notes = [];
            appData.notes.unshift({ 
                id: Date.now(), 
                who: currentWho, 
                time: new Date().toLocaleDateString(), 
                content: text 
            });
            document.getElementById('new-note-content').value = '';

            renderNotes();
            await saveToCloud();
        }

        function renderNotes() {
            const container = document.getElementById('notes-container');
            container.innerHTML = '';
            const dict = i18n[currentLang];

            if (!appData.notes || appData.notes.length === 0) {
                container.innerHTML = `<p style="text-align:center; color:#aaa; font-size:0.9rem;">${dict.empty_text}</p>`;
                return;
            }

            appData.notes.forEach(note => {
                const card = document.createElement('div');
                card.className = 'card';
                card.style.background = '#fffdfa';
                card.style.borderColor = '#faedcd';
                card.innerHTML = `
                    <div class="card-header">
                        <span>${note.time}</span>
                        ${getBadgeHtml(note.who)}
                    </div>
                    <div style="white-space: pre-wrap; font-size: 0.95rem; line-height: 1.4; color: #d4a373;">💛 ${note.content}</div>
                `;
                container.appendChild(card);
            });
        }
    </script>
</body>
</html>
